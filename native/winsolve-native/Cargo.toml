[package]
name = "winsolve-native"
version = "0.1.0"
edition = "2021"
description = "Fast disk scanner and duplicate finder for WinSolve (loaded by the C# app through a C ABI)."
publish = false

[lib]
name = "winsolve_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
