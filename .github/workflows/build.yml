name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish WinSolve.exe
        run: dotnet publish src/WinSolve/WinSolve.csproj -c Release -o out/app

      - name: Build installer
        if: hashFiles('src/WinSolve.Setup/WinSolve.Setup.csproj') != ''
        run: dotnet build src/WinSolve.Setup/WinSolve.Setup.csproj -c Release -p:AppExe=${{ github.workspace }}/out/app/WinSolve.exe -o out/setup

      - uses: actions/upload-artifact@v4
        with:
          name: WinSolve
          path: |
            out/app/WinSolve.exe
            out/setup/WinSolveSetup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/setup/WinSolveSetup.exe out/app/WinSolve.exe --title "WinSolve ${{ github.ref_name }}" --generate-notes
