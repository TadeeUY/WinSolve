name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # SignPath downloads the unsigned files from this run's artifacts

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing turns on by itself once the SignPath secrets exist (Settings > Secrets >
      # Actions: SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID). Until then releases are unsigned.
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test tests/WinSolve.Tests/WinSolve.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish WinSolve.exe (embedded in the installer)
        run: dotnet publish src/WinSolve/WinSolve.csproj -c Release -o out/app

      - name: Publish WinSolve-Portable.exe
        shell: pwsh
        run: |
          # Self-contained (no .NET install needed) single file that runs from a USB stick.
          dotnet publish src/WinSolve/WinSolve.csproj -c Release -p:Portable=true -o out/portable
          Move-Item out/portable/WinSolve.exe out/portable/WinSolve-Portable.exe

      # ── Signing, part 1: the app itself (it is embedded in the installer, so it's signed first) ──
      - name: Collect the app for signing
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/unsigned-app | Out-Null
          Copy-Item out/app/WinSolve.exe, out/portable/WinSolve-Portable.exe out/unsigned-app/

      - id: unsigned-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: out/unsigned-app/*.exe

      - name: Sign the app (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: WinSolve
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/signed-app

      - name: Use the signed app
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item out/signed-app/WinSolve.exe out/app/WinSolve.exe -Force
          Copy-Item out/signed-app/WinSolve-Portable.exe out/portable/WinSolve-Portable.exe -Force
          Get-AuthenticodeSignature out/app/WinSolve.exe, out/portable/WinSolve-Portable.exe | Format-Table Status, Path

      - name: Build installer
        if: hashFiles('src/WinSolve.Setup/WinSolve.Setup.csproj') != ''
        run: dotnet build src/WinSolve.Setup/WinSolve.Setup.csproj -c Release -p:AppExe=${{ github.workspace }}/out/app/WinSolve.exe -o out/setup

      # ── Signing, part 2: the installer ──
      - id: unsigned-setup
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: out/setup/WinSolveSetup.exe

      - name: Sign the installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: WinSolve
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/signed-setup

      - name: Use the signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item out/signed-setup/WinSolveSetup.exe out/setup/WinSolveSetup.exe -Force
          $sig = Get-AuthenticodeSignature out/setup/WinSolveSetup.exe
          $sig | Format-List Status, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "The signed installer's signature is not valid ($($sig.Status))." }

      - name: Checksum
        if: hashFiles('out/setup/WinSolveSetup.exe') != ''
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/setup/WinSolveSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinSolveSetup.exe" | Out-File -Encoding ascii -NoNewline out/setup/WinSolveSetup.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: WinSolve
          path: |
            out/portable/WinSolve-Portable.exe
            out/setup/WinSolveSetup.exe
            out/setup/WinSolveSetup.exe.sha256

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version comes from the app's project file; one release per version.
          [xml]$proj = Get-Content src/WinSolve/WinSolve.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          [xml]$setupProj = Get-Content src/WinSolve.Setup/WinSolve.Setup.csproj
          $setupVersion = ($setupProj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($setupVersion -ne $version) { throw "Version mismatch: app $version, setup $setupVersion." }
          $tag = "v$version"
          # A tag that doesn't match the app's version would make every install see an "update" forever.
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match the app version $version."
          }
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            # A published version is never replaced: work in progress keeps the same version
            # and only a new version number publishes a new release.
            Write-Host "Release $tag already exists; nothing is published. Bump the version to release."
            $global:LASTEXITCODE = 0
          } else {
            gh release create $tag out/setup/WinSolveSetup.exe out/setup/WinSolveSetup.exe.sha256 out/portable/WinSolve-Portable.exe `
              --repo ${{ github.repository }} --target ${{ github.sha }} --title "WinSolve $tag" `
              --notes "Download **WinSolveSetup.exe** and run it. Choose *Only me* or *All users (recommended)*. It installs the .NET 8 Desktop Runtime automatically if needed.`n`n**WinSolve-Portable.exe** runs without installing (for example from a USB stick) and needs nothing else."
          }
