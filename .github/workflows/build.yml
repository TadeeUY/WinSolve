name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test tests/WinSolve.Tests/WinSolve.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish WinSolve.exe
        run: dotnet publish src/WinSolve/WinSolve.csproj -c Release -o out/app

      - name: Build installer
        if: hashFiles('src/WinSolve.Setup/WinSolve.Setup.csproj') != ''
        run: dotnet build src/WinSolve.Setup/WinSolve.Setup.csproj -c Release -p:AppExe=${{ github.workspace }}/out/app/WinSolve.exe -o out/setup

      - name: Checksum
        if: hashFiles('out/setup/WinSolveSetup.exe') != ''
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/setup/WinSolveSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinSolveSetup.exe" | Out-File -Encoding ascii -NoNewline out/setup/WinSolveSetup.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: WinSolve
          path: |
            out/app/WinSolve.exe
            out/setup/WinSolveSetup.exe
            out/setup/WinSolveSetup.exe.sha256

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version comes from the app's project file; one release per version.
          [xml]$proj = Get-Content src/WinSolve/WinSolve.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          [xml]$setupProj = Get-Content src/WinSolve.Setup/WinSolve.Setup.csproj
          $setupVersion = ($setupProj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($setupVersion -ne $version) { throw "Version mismatch: app $version, setup $setupVersion." }
          $tag = "v$version"
          # A tag that doesn't match the app's version would make every install see an "update" forever.
          if ("${{ github.ref }}".StartsWith('refs/tags/') -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match the app version $version."
          }
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; updating its files."
            gh release upload $tag out/setup/WinSolveSetup.exe out/setup/WinSolveSetup.exe.sha256 out/app/WinSolve.exe --clobber --repo ${{ github.repository }}
          } else {
            gh release create $tag out/setup/WinSolveSetup.exe out/setup/WinSolveSetup.exe.sha256 out/app/WinSolve.exe `
              --repo ${{ github.repository }} --target ${{ github.sha }} --title "WinSolve $tag" `
              --notes "Download **WinSolveSetup.exe** and run it. Choose *Only me* or *All users (recommended)*. It installs the .NET 8 Desktop Runtime automatically if needed.`n`nWinSolve.exe is the app alone (requires the .NET 8 Desktop Runtime)."
          }
