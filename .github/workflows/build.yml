name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test tests/WinSolve.Tests/WinSolve.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish WinSolve.exe (embedded in the installer)
        run: dotnet publish src/WinSolve/WinSolve.csproj -c Release -o out/app

      - name: Publish WinSolve-Portable.exe
        shell: pwsh
        run: |
          # Self-contained (no .NET install needed) single file that runs from a USB stick.
          dotnet publish src/WinSolve/WinSolve.csproj -c Release -p:Portable=true -o out/portable
          Move-Item out/portable/WinSolve.exe out/portable/WinSolve-Portable.exe

      - name: Build installer
        if: hashFiles('src/WinSolve.Setup/WinSolve.Setup.csproj') != ''
        run: dotnet build src/WinSolve.Setup/WinSolve.Setup.csproj -c Release -p:AppExe=${{ github.workspace }}/out/app/WinSolve.exe -o out/setup

      - name: Checksum
        if: hashFiles('out/setup/WinSolveSetup.exe') != ''
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/setup/WinSolveSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinSolveSetup.exe" | Out-File -Encoding ascii -NoNewline out/setup/WinSolveSetup.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: WinSolve
          path: |
            out/portable/WinSolve-Portable.exe
            out/setup/WinSolveSetup.exe
            out/setup/WinSolveSetup.exe.sha256

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version comes from the app's project file; one release per version.
          [xml]$proj = Get-Content src/WinSolve/WinSolve.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          [xml]$setupProj = Get-Content src/WinSolve.Setup/WinSolve.Setup.csproj
          $setupVersion = ($setupProj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($setupVersion -ne $version) { throw "Version mismatch: app $version, setup $setupVersion." }
          $tag = "v$version"
          # A tag that doesn't match the app's version would make every install see an "update" forever.
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match the app version $version."
          }
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            # A published version is never replaced: work in progress keeps the same version
            # and only a new version number publishes a new release.
            Write-Host "Release $tag already exists; nothing is published. Bump the version to release."
            $global:LASTEXITCODE = 0
          } else {
            gh release create $tag out/setup/WinSolveSetup.exe out/setup/WinSolveSetup.exe.sha256 out/portable/WinSolve-Portable.exe `
              --repo ${{ github.repository }} --target ${{ github.sha }} --title "WinSolve $tag" `
              --notes "Download **WinSolveSetup.exe** and run it. Choose *Only me* or *All users (recommended)*. It installs the .NET 8 Desktop Runtime automatically if needed.`n`n**WinSolve-Portable.exe** runs without installing (for example from a USB stick) and needs nothing else."
          }
